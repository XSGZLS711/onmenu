<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><script src="demo/backend/core.js"></script><script src="demo/backend/base.js"></script><script src="demo/backend/sales.js"></script><script src="demo/backend/stock.js"></script><script src="demo/backend/extras.js"></script><script src="demo/backend/reports.js"></script><script src="demo/backend/admin.js"></script><script src="demo/backend/start.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoftPOS · Offline stocktake</title><link rel="stylesheet" href="app.css?v=102"><link rel="stylesheet" href="inventory-suite.css"><script src="vendor/zxing-browser-0.1.5.min.js" defer></script><script src="product-picker.js?v=3" defer></script><script src="stocktake-offline.js?v=2" defer></script>  <link rel="stylesheet" href="ui-text.css?v=1">
</head><body><main class="stocktake-shell"><div class="section-header"><h1>Mobile stocktake</h1><a href="index.html">Back to POS / sign in</a></div><p>Scan a barcode, enter the counted quantity and save it on this device. Upload the count when connected. Posting to main stock is a separate review step.</p><p id="countConnection" role="status"></p><section class="suite-card"><h2>Count sessions</h2><div id="countSessions"></div><form id="prepareCount"><label class="check-label"><input type="checkbox" required> Store this branch catalog and count on this trusted device</label><button type="submit" class="primary">Download new count for selected branch</button></form></section><section id="countWork" class="suite-card" hidden><h2 id="countTitle"></h2><form id="countSearch"><label>Barcode, product code or name<input id="countCode" maxlength="250" autocomplete="off" autofocus></label><div class="suite-actions"><button type="submit" class="primary">Find / scan</button><button id="countBrowseProducts" type="button">Search Products</button><button id="countCamera" type="button">Camera scan</button><button id="countShowAll" type="button">Show counted items</button></div></form><div id="countMatches" class="suite-results"></div><form id="countQuantityForm" class="count-selected" hidden><h3 id="countProductName"></h3><p id="countPrevious"></p><label>Counted quantity<input id="countQuantity" type="number" min="0" max="1000000" step="0.0001" inputmode="decimal" required></label><div class="suite-actions"><button class="primary" type="submit">Save quantity</button><button id="countAddQuantity" type="button">Add to saved quantity</button></div></form><p id="countProgress"></p><div class="suite-actions"><button id="uploadCount" type="button" class="primary">Push count to main</button><button id="exportCount" type="button">Export count backup</button></div><p id="countStatus" class="suite-status" role="status"></p></section><dialog id="countCameraDialog"><div class="dialog-card"><div class="dialog-head"><h2>Scan product barcode</h2><button id="closeCountCamera" type="button" class="icon-btn">×</button></div><video id="countVideo" autoplay muted playsinline style="width:100%"></video><p id="countCameraStatus"></p></div></dialog><p id="countError" class="error" role="alert"></p></main></body></html>
